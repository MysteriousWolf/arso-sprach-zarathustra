[project]
name = "arso-sprach-zarathustra"
version = "26.1"
description = "Unofficial ARSO Discord weather bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.1.1",
    "APScheduler>=3.10.0",
    "astral>=3.2",
    "html2image>=2.0.7",
    "Pillow>=9.4.0",
    "PyYAML>=6.0",
    "requests>=2.28.2",
    "colour>=0.1.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
