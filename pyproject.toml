[project]
name = "arso-sprach-zarathustra"
version = "26.1"
description = "Unofficial ARSO Discord weather bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7.1",
    "APScheduler>=3.11.3",
    "astral>=3.2",
    "html2image>=2.0.7",
    "Pillow>=12.2.0",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "colour>=0.1.5",
    "rich>=15.0.0",
    "platformdirs>=4.0.0",
    "pyfiglet>=1.0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long — ruff format handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "types-pyyaml>=6.0.12.20260518",
    "types-requests>=2.33.0.20260518",
]
