name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false
      release_notes:
        description: Release notes (leave blank to auto-generate from commits)
        type: string
        required: false

jobs:
  # Re-run all CI checks on the exact commit being tagged.
  # The release proceeds only if every check passes.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag & Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Fail if tag already exists
        run: |
          if git tag --list | grep -qx "${{ steps.version.outputs.version }}"; then
            echo "ERROR: tag '${{ steps.version.outputs.version }}' already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then PRERELEASE="--prerelease"; fi
          if [[ -n "$RELEASE_NOTES" ]]; then
            gh release create "$VERSION" --title "$VERSION" ${PRERELEASE} --notes "$RELEASE_NOTES"
          else
            gh release create "$VERSION" --title "$VERSION" ${PRERELEASE} --generate-notes
          fi
